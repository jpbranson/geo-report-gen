# Run any gr.R command in the container, from the project root:
#   docker compose run --rm gr build gary-in
#   docker compose run --rm --service-ports gr preview gary-in   (then open http://localhost:4848)
# The first run builds the image. The checkout is mounted at /app, so .env, config, content,
# cache/ and reports/ are the host's own files.
services:
  gr:
    build: .
    image: geo-report-gen
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:4848:4848"   # preview, reachable from this machine only
    environment:
      # Time zone of cache times and "retrieved on" dates in reports: Central time unless TZ is
      # set in the shell (e.g. TZ=America/New_York docker compose run ...).
      TZ: ${TZ:-America/Chicago}
